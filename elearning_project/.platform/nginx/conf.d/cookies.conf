# Pass the original cookie header to the backend
proxy_set_header Cookie $http_cookie;

# Ensure Set-Cookie headers from the backend are passed to the client
proxy_pass_header Set-Cookie;

# Also pass the Cookie header from client to backend
proxy_pass_header Cookie;

# Pass the X-Request-ID if you use it
proxy_set_header X-Request-ID $request_id;

# Increase buffer size for headers (helps with large cookies)
proxy_buffer_size 8k;
proxy_buffers 8 8k;

# Don't buffer responses to ensure cookies are sent immediately
proxy_buffering off;